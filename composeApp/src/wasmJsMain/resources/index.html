<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ari Sastro Wardoyo Supiatma · portfolio.kt</title>
    <meta name="description" content="Ship log of Ari SWS — Android Engineer. Kotlin, Compose, Clean Architecture.">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #0B0D12;
            overflow: hidden;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        /* Hide broken first paint of canvas until app signals ready */
        body.booting canvas {
            opacity: 0;
        }
        body.ready canvas {
            opacity: 1;
            transition: opacity 0.25s ease;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #0B0D12;
            color: #9AA1B2;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #loading.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #loading .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3DDC84;
            animation: pulse 1s ease-in-out infinite;
        }
        #loading .label {
            font-size: 12px;
            letter-spacing: 0.04em;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.35; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1); }
        }

        #warning {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 640px;
            z-index: 10000;
            background: #141820;
            color: #E8EAF0;
            border: 1px solid #262B36;
            border-radius: 12px;
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body class="booting">
<div id="loading">
    <div class="dot"></div>
    <div class="label">loading portfolio.kt…</div>
</div>
<div id="warning">
    Browser needs modern Wasm GC support.
    See <a href="https://kotl.in/wasm-help" style="color:#3DDC84">kotl.in/wasm-help</a>.
</div>
<script type="application/javascript">
    const unhandledError = (event, error) => {
        if (error instanceof WebAssembly.CompileError) {
            document.getElementById("warning").style.display = "block";
            document.getElementById("loading").classList.add("hidden");
        }
    }
    addEventListener("error", (event) => unhandledError(event, event.error));
    addEventListener("unhandledrejection", (event) => unhandledError(event, event.reason));
</script>
<script src="portfolio.js"></script>
</body>
</html>
